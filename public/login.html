<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Invoice &amp; Food Cost</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧾</text></svg>">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { width: min(380px, 100%); text-align: center; }
    .login-card .brand-mark { font-size: 34px; display: block; margin-bottom: 6px; }
    .login-card h1 { font-size: 19px; margin-bottom: 4px; }
    .login-card form { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; text-align: left; }
    .login-card .btn { width: 100%; padding: 10px; }
    .login-error { color: var(--danger); font-size: 13px; min-height: 18px; margin: 0; }
  </style>
</head>
<body>
  <div class="card login-card">
    <span class="brand-mark">🧾</span>
    <h1>Invoice &amp; Food Cost</h1>
    <p class="muted small" id="login-hint">Enter the shared password to continue.</p>
    <form id="login-form">
      <label>Password
        <input type="password" id="password" autocomplete="current-password" autofocus required>
      </label>
      <label id="code-field" class="hidden">Six-digit code
        <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code"
               pattern="[0-9]*" maxlength="6" placeholder="000000">
      </label>
      <p class="login-error" id="login-error"></p>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </div>

  <script>
    const codeField = document.querySelector('#code-field');
    const codeInput = document.querySelector('#code');
    const error = document.querySelector('#login-error');

    // Show the code box straight away when two-factor is on.
    fetch('/api/session')
      .then((r) => r.json())
      .then((s) => {
        if (s.two_factor_required) {
          codeField.classList.remove('hidden');
          document.querySelector('#login-hint').textContent =
            'Enter the shared password and the current code from your authenticator app.';
        }
        if (s.lockout && s.lockout.locked) {
          error.textContent = `Locked after too many attempts. Try again in ${s.lockout.minutes} minute${s.lockout.minutes === 1 ? '' : 's'}.`;
        }
      })
      .catch(() => {});

    codeInput.addEventListener('input', () => {
      codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 6);
    });

    document.querySelector('#login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      error.textContent = '';
      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            password: document.querySelector('#password').value,
            code: codeInput.value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) {
          if (data.need_code) codeField.classList.remove('hidden');
          let message = data.error || 'Could not sign in.';
          if (!data.locked && typeof data.attempts_remaining === 'number' && data.attempts_remaining <= 2) {
            message += ` ${data.attempts_remaining} attempt${data.attempts_remaining === 1 ? '' : 's'} left before a lockout.`;
          }
          throw new Error(message);
        }
        window.location.href = '/';
      } catch (err) {
        error.textContent = err.message;
        codeInput.value = '';
        document.querySelector('#password').select();
      }
    });
  </script>
</body>
</html>
